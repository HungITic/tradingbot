[project]
name = "trading-bot"
version = "1.0.0"
description = "Trading automation bot - Telegram signals → MT5/Exness execution"
requires-python = ">=3.11"
dependencies = [
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",

    # Telegram
    "python-telegram-bot[job-queue]>=20.0",
    "telethon>=1.36",

    # MT5 (native on Windows, mt5_mac bridge on macOS Apple Silicon)
    "MetaTrader5>=5.0; sys_platform == 'win32'",
    "mt5_mac>=0.3.0; sys_platform == 'darwin'",

    # Logging
    "structlog>=24.0",

    # Utils
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "Darwin"
extraPaths = ["."]
typeCheckingMode = "basic"
reportOptionalMemberAccess = "none"
reportGeneralTypeIssues = "none"
reportAttributeAccessIssue = "none"
reportArgumentType = "none"

